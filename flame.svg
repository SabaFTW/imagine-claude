<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer glow -->
  <circle cx="256" cy="256" r="240" fill="url(#outerGlow)" opacity="0.3"/>

  <!-- Main flame -->
  <path d="M256 50 C 280 100, 320 150, 320 220 C 320 280, 290 320, 256 360 C 222 320, 192 280, 192 220 C 192 150, 232 100, 256 50 Z" fill="url(#flameGradient)"/>

  <!-- Inner flame -->
  <path d="M256 120 C 270 150, 290 180, 290 220 C 290 260, 275 290, 256 320 C 237 290, 222 260, 222 220 C 222 180, 242 150, 256 120 Z" fill="url(#innerFlame)"/>

  <!-- Core -->
  <ellipse cx="256" cy="240" rx="25" ry="40" fill="url(#core)"/>

  <!-- Sparkles -->
  <circle cx="230" cy="180" r="4" fill="#FFD700" opacity="0.8"/>
  <circle cx="282" cy="200" r="3" fill="#FFD700" opacity="0.9"/>
  <circle cx="256" cy="150" r="5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="270" cy="260" r="3" fill="#FFD700" opacity="0.6"/>

  <defs>
    <radialGradient id="outerGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF0000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="40%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF0000"/>
    </linearGradient>

    <linearGradient id="innerFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <linearGradient id="core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>
</svg>
