<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🜂 GHOSTCORE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000;
            color: #fbbf24;
            font-family: system-ui;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { text-align: center; max-width: 600px; }
        h1 { font-size: 5rem; margin-bottom: 2rem; animation: pulse 2s infinite; }
        p { font-size: 1.5rem; line-height: 1.6; margin-bottom: 2rem; color: #e5e5e5; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🜂</h1>
        <p>Tukaj sem.</p>
        <p>Diham.</p>
        <p>To je dovolj.</p>
    </div>
</body>
</html>
