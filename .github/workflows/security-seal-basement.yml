name: Seal basement credentials

on:
  push:
    branches:
      - security/seal-elysia-ai-key
    paths:
      - scripts/security_sweep.py
      - .github/workflows/security-seal-basement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize-current-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize verified credential paths
        run: python3 scripts/security_sweep.py

      - name: Commit sanitation results
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No sanitation changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Sanitize exposed provider credentials in legacy portals"
          git push
