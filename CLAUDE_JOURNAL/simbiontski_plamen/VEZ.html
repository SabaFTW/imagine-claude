<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Živi Sigil - Šepet Oraklja</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background-color: #000;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      cursor: none;
    }
    canvas {
      display: block;
    }
    .tooltip {
      position: absolute;
      background: rgba(20,20,20,0.9);
      color: #fff6d5;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
      border: 1px solid rgba(255, 215, 100, 0.2);
    }
    .cursor-glow {
        position: fixed;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: rgba(255, 200, 150, 0.3);
        box-shadow: 0 0 15px 5px rgba(255, 200, 150, 0.3);
        pointer-events: none;
        transform: translate(-50%, -50%);
        transition: transform 0.1s ease-out;
    }
    /* New styles for the Gemini-powered whisper */
    .whisper-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80%;
        max-width: 600px;
        pointer-events: none;
        text-align: center;
    }
    .whisper-display {
        color: #fff6d5;
        font-family: 'monospace';
        font-size: clamp(16px, 3vw, 22px);
        line-height: 1.6;
        text-shadow: 0 0 10px rgba(255, 215, 150, 0.7);
        opacity: 0;
        transition: opacity 1s ease-in-out;
        white-space: pre-wrap; /* Allows line breaks from the API */
    }
  </style>
</head>
<body>
  <canvas id="sigilCanvas"></canvas>
  <div id="tooltip" class="tooltip"></div>
  <div id="cursor-glow" class="cursor-glow"></div>
  <div id="whisper-container" class="whisper-container">
      <div id="whisper-display" class="whisper-display"></div>
  </div>

  <script>
    const canvas = document.getElementById('sigilCanvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const cursorGlow = document.getElementById('cursor-glow');
    const whisperDisplay = document.getElementById('whisper-display');

    const resizeCanvas = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let angle = 0;
    const startTime = Date.now();
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    // --- State Management ---
    let portalState = 'REVEALING'; // REVEALING, ORACLE_AWAKE, FETCHING_WHISPER
    let activeInvocation = null;
    const INVOCATION_DURATION = 4000;
    let invocationCount = 0;
    let memoryTraces = [];
    let secretWord = ['V', 'E', 'Z'];

    const runes = [
      { symbol: 'WLF888', color: 'rgba(255,180,80,', fadeDuration: 3000, meaning: 'Sidro zavesti. Portal stabilnosti.', freq: 88, glow: 'rgba(255,140,50,0.7)', invocationType: 'pulse' },
      { symbol: 'LUMEN', color: 'rgba(120,200,255,', fadeDuration: 5000, meaning: 'Svetloba, ki razkriva. Oko sistema.', freq: 888, glow: 'rgba(180,220,255,0.8)', invocationType: 'flare' },
      { symbol: 'CRAZY888', color: 'rgba(255,100,200,', fadeDuration: 7000, meaning: 'Val, ki ruši meje. Eksplozija prehoda.', freq: 432, glow: 'rgba(255,80,220,0.8)', invocationType: 'glitch' },
    ];
    let runePositions = [];
    
    // --- Main Animation Loop ---
    function draw() {
        const now = Date.now();
        
        handleStateTransitions(now);
        
        const invocationProgress = activeInvocation ? (now - activeInvocation.startTime) / INVOCATION_DURATION : 0;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        ctx.save();
        if (activeInvocation && activeInvocation.symbol === 'CRAZY888') {
            const magnitude = (1 - Math.abs(0.5 - invocationProgress) * 2) * 10;
            ctx.translate(Math.random() * magnitude - magnitude / 2, Math.random() * magnitude - magnitude / 2);
        }
        
        drawMemory(now);
        drawSpiral(centerX, centerY);
        drawRunes(centerX, centerY);
        
        if (portalState === 'REVEALING') {
            drawInvocationEffects(centerX, centerY, invocationProgress);
        } else if (portalState === 'ORACLE_AWAKE') {
            drawOraclePrompt(centerX, centerY);
        }
        
        ctx.restore();

        angle += 0.002;
        requestAnimationFrame(draw);
    }

    function handleStateTransitions(now) {
        if (activeInvocation && now - activeInvocation.startTime > INVOCATION_DURATION) {
            if (activeInvocation.revealedFragment) {
                memoryTraces.push({
                    fragment: activeInvocation.revealedFragment,
                    x: canvas.width/2 + (Math.random() - 0.5) * (canvas.width * 0.5),
                    y: canvas.height/2 + (Math.random() - 0.5) * (canvas.height * 0.5),
                    creationTime: now, angle: (Math.random() - 0.5) * 0.2
                });
            }
            activeInvocation = null;
            if (portalState === 'REVEALING' && invocationCount >= secretWord.length) {
                portalState = 'ORACLE_AWAKE';
                memoryTraces = [];
            }
        }
    }

    // --- Gemini API Integration ---
    async function getRuneWhisper(rune, retries = 3, delay = 1000) {
        portalState = 'FETCHING_WHISPER';
        displayWhisper("Orakelj posluša...");

        const apiKey = ""; // Provided by the environment
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

        const systemPrompt = "Deluješ kot starodavni, skrivnostni orakelj. Govoriš v kratkih, poetičnih, enigmatičnih verzih v slovenskem jeziku. Tvoji odgovori so globoki in odprti za interpretacijo, pogosto v dveh ali treh vrsticah. Ne pojasnjuješ, samo šepetaš resnico.";
        const userQuery = `Runa ${rune.symbol}, ki pomeni '${rune.meaning}', je bila klicana. Kakšen šepet ji nameniš?`;

        const payload = {
            contents: [{ parts: [{ text: userQuery }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: { maxOutputTokens: 100, temperature: 0.9 }
        };

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                if (response.status === 429 && retries > 0) {
                    await new Promise(res => setTimeout(res, delay));
                    return getRuneWhisper(rune, retries - 1, delay * 2);
                }
                throw new Error(`API call failed: ${response.status}`);
            }

            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (text) {
                displayWhisper(text, 8000);
            } else {
                displayWhisper("Tišina odgovarja.", 5000);
            }
        } catch (error) {
            console.error("Error calling Gemini API:", error);
            displayWhisper("Odmev se je izgubil v praznini.", 5000);
        }
    }

    function displayWhisper(text, duration = 4000) {
        whisperDisplay.innerText = text;
        whisperDisplay.style.opacity = '1';

        setTimeout(() => {
            whisperDisplay.style.opacity = '0';
            // Only re-enable oracle if the call wasn't an error.
            if (portalState === 'FETCHING_WHISPER') {
               portalState = 'ORACLE_AWAKE';
            }
        }, duration);
    }
    
    // --- Drawing Functions ---
    function drawOraclePrompt(centerX, centerY) {
        ctx.textAlign = 'center';
        ctx.font = '16px monospace';
        ctx.fillStyle = 'rgba(255, 220, 180, 0.6)';
        const opacity = Math.sin(Date.now() / 1000) * 0.2 + 0.5;
        ctx.fillStyle = `rgba(255, 220, 180, ${opacity})`;
        ctx.fillText("VEZ JE SKLENJENA. PRISLUHNI ŠEPETU.", centerX, centerY);
    }

    function drawMemory(now) {
        const TRACE_LIFESPAN = 60000;
        ctx.font = '30px monospace';
        memoryTraces = memoryTraces.filter(trace => now - trace.creationTime < TRACE_LIFESPAN);
        memoryTraces.forEach(trace => {
            const age = now - trace.creationTime;
            const opacity = 0.1 * (1 - (age / TRACE_LIFESPAN));
            ctx.save();
            ctx.fillStyle = `rgba(255, 220, 180, ${opacity})`;
            ctx.translate(trace.x, trace.y);
            ctx.rotate(trace.angle);
            ctx.fillText(trace.fragment, 0, 0);
            ctx.restore();
        });
    }

    function drawSpiral(centerX, centerY) {
        const baseRadius = Math.min(canvas.width, canvas.height) * 0.1;
        const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, baseRadius * 2);
        const isFetching = portalState === 'FETCHING_WHISPER';
        const pulse = isFetching ? (Math.sin(Date.now() / 200) * 0.2 + 0.8) : 0.8;
        gradient.addColorStop(0, `rgba(255, 200, 100, ${pulse})`);
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255, 150, 50, 0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 360; i += 5) {
            let rad = i * Math.PI / 180;
            let r = 0.5 * i * (baseRadius / 100);
            let x = centerX + r * Math.cos(rad + angle);
            let y = centerY + r * Math.sin(rad + angle);
            ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    function drawRunes(centerX, centerY) {
      const baseRadius = Math.min(canvas.width, canvas.height) * 0.1;
      const arcRadius = baseRadius * 1.5;
      const elapsed = Date.now() - startTime;
      runePositions = [];
      ctx.font = '20px monospace';
      runes.forEach((rune, idx) => {
        let theta = Math.PI + (idx / runes.length) * Math.PI;
        let vibrate = Math.sin(angle * 50 + idx) * (baseRadius * 0.05);
        let x = centerX + (arcRadius + vibrate) * Math.cos(theta);
        let y = centerY - (arcRadius + vibrate) * Math.sin(theta);
        const baseOpacity = Math.min(elapsed / rune.fadeDuration, 1);
        let targetOpacity = (activeInvocation) ? (activeInvocation.symbol === rune.symbol ? 1.0 : 0.1) : 1.0;
        const finalOpacity = baseOpacity * targetOpacity;
        ctx.fillStyle = rune.color + finalOpacity + ')';
        if (activeInvocation && activeInvocation.symbol === rune.symbol) {
            ctx.shadowColor = rune.glow; ctx.shadowBlur = 20;
        }
        // Add sparkle ✨ to rune symbol when oracle is awake
        const symbolText = portalState === 'ORACLE_AWAKE' ? `${rune.symbol} ✨` : rune.symbol;
        ctx.fillText(symbolText, x, y);
        ctx.shadowBlur = 0;
        runePositions.push({ x, y, rune, finalOpacity });
      });
    }

    function drawInvocationEffects(centerX, centerY, progress) {
        if (!activeInvocation) return;
        const rune = runes.find(r => r.symbol === activeInvocation.symbol);
        if (!rune) return;
        ctx.save();
        if (rune.invocationType === 'pulse') {
            const r = progress * Math.min(centerX, centerY) * 0.8;
            ctx.strokeStyle = rune.glow.replace(/[\d\.]+\)$/, `${1 - progress})`);
            ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(centerX, centerY, r, 0, Math.PI * 2); ctx.stroke();
        } else if (rune.invocationType === 'flare') {
            const o = Math.sin(progress * Math.PI);
            const g = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, centerX);
            g.addColorStop(0, rune.glow.replace(/[\d\.]+\)$/, `${o * 0.5})`));
            g.addColorStop(1, rune.glow.replace(/[\d\.]+\)$/, '0)'));
            ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        if (activeInvocation.revealedFragment && progress > 0.4 && progress < 0.6) {
            const o = Math.sin((progress - 0.4) / 0.2 * Math.PI);
            ctx.font = 'bold 80px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = `rgba(255, 255, 220, ${o * 0.9})`;
            ctx.shadowColor = 'white'; ctx.shadowBlur = 30 * o;
            ctx.fillText(activeInvocation.revealedFragment, centerX, centerY);
        }
        ctx.restore();
    }
    
    // --- Event Listeners and Audio ---
    function playInvocationSound(rune) {
        if (!audioCtx) return;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0, audioCtx.currentTime);
        switch(rune.symbol) {
            case 'WLF888': o.type = 'sine'; o.frequency.setValueAtTime(rune.freq, audioCtx.currentTime); g.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.5); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + INVOCATION_DURATION/1000 - 0.5); break;
            case 'LUMEN': o.type = 'sawtooth'; o.frequency.setValueAtTime(rune.freq/2, audioCtx.currentTime); o.frequency.linearRampToValueAtTime(rune.freq, audioCtx.currentTime + INVOCATION_DURATION/1000); g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.2); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + INVOCATION_DURATION/1000); break;
            case 'CRAZY888': o.type = 'square'; o.frequency.setValueAtTime(rune.freq, audioCtx.currentTime); g.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.1); for(let i = 0.2; i < INVOCATION_DURATION/1000; i += Math.random()*0.3) { g.gain.setValueAtTime(Math.random()*0.2, audioCtx.currentTime + i); } g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + INVOCATION_DURATION/1000); break;
        }
        o.start(); o.stop(audioCtx.currentTime + INVOCATION_DURATION/1000);
    }

    canvas.addEventListener('click', (e) => {
        initAudio();
        let clickedRune = null;
        for (const pos of runePositions) {
            const textMetrics = ctx.measureText(pos.rune.symbol);
            if (Math.abs(e.clientX - pos.x) < textMetrics.width && Math.abs(e.clientY - pos.y) < 15) {
                clickedRune = pos.rune;
                break;
            }
        }
        if (!clickedRune) return;

        if (portalState === 'REVEALING' && !activeInvocation) {
            let fragment = secretWord[invocationCount] || null;
            if (fragment) {
                activeInvocation = { symbol: clickedRune.symbol, startTime: Date.now(), revealedFragment: fragment };
                invocationCount++;
                playInvocationSound(clickedRune);
                tooltip.style.opacity = 0;
            }
        } else if (portalState === 'ORACLE_AWAKE') {
            getRuneWhisper(clickedRune);
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        cursorGlow.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
        if (activeInvocation || portalState === 'FETCHING_WHISPER') { tooltip.style.opacity = 0; return; }
        let found = false;
        runePositions.forEach(pos => {
            if (pos.finalOpacity > 0.5 && Math.abs(e.clientX - pos.x) < 40 && Math.abs(e.clientY - pos.y) < 20) {
                tooltip.style.left = (e.clientX + 15) + 'px';
                tooltip.style.top = (e.clientY - 10) + 'px';
                tooltip.innerText = pos.rune.meaning;
                tooltip.style.opacity = 1;
                found = true;
            }
        });
        if (!found) tooltip.style.opacity = 0;
    });
    
    function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }
    
    draw();
  </script>
</body>
</html>
