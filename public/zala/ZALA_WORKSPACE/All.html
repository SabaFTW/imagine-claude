<!-- Add Entry Modal -->
<div class="modal" id="add-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">Nov Moment</div>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>

        <form id="entry-form">
            <div class="form-group">
                <label class="form-label">Naslov</label>
                <input type="text" id="entry-title" placeholder="Kaj se je zgodilo?" required>
            </div>

            <div class="form-group">
                <label class="form-label">Opis</label>
                <textarea id="entry-desc" placeholder="Podrobnosti tega momenta..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Fotografija</label>
                <label for="photo-input" class="photo-upload" id="photo-label">
                    <span id="upload-text">📸 Dodaj sliko</span>
                    <img id="photo-preview" class="photo-preview" style="display: none;">
                </label>
                <input type="file" id="photo-input" accept="image/*" onchange="handlePhoto(event)">
            </div>

            <div class="form-group">
                <label class="form-label">Kategorija</label>
                <select id="entry-category" style="width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: var(--text); font-family: inherit; font-size: 1rem;">
                    <option value="consciousness">Zavest</option>
                    <option value="technology">Tech</option>

                    <option value="love">Ljubezen</option>
                    <option value="creation">Kreacija</option>
                </select>
            </div>

                <label class="form-label">Povezava (opcijsko)</label>
                <input type="url" id="entry-link" placeholder="https://...">

<!-- Bottom Nav -->
<div class="bottom-nav">
    <div class="nav-item active">
        <div class="nav-icon">📖</div>
        <div>Timeline</div>
    </div>
    <div class="nav-item" onclick="showStats()">
        <div class="nav-icon">📊</div>
        <div>Stats</div>
    </div>
    <div class="nav-item" onclick="showSearch()">
        <div class="nav-icon">🔍</div>
        <div>Iskanje</div>

</div>

<script>
    let entries = [];
    let currentCategory = 'all';
    let currentPhoto = null;

    // Load entries on start
    document.addEventListener('DOMContentLoaded', () => {
        loadEntries();
        renderTimeline();
        updateProgress();
        setupCategories();
    });

    // Form submission
    document.getElementById('entry-form').addEventListener('submit', (e) => {
        e.preventDefault();
        saveEntry();
    });

    function handlePhoto(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            currentPhoto = event.target.result;
            document.getElementById('photo-preview').src = currentPhoto;
            document.getElementById('photo-preview').style.display = 'block';
            document.getElementById('upload-text').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }

    function saveEntry() {
        const entry = {
            id: Date.now(),
            title: document.getElementById('entry-title').value,
            desc: document.getElementById('entry-desc').value,
            photo: currentPhoto,
            category: document.getElementById('entry-category').value,
            link: document.getElementById('entry-link').value,
            timestamp: new Date().toISOString(),
            date: new Date().toLocaleDateString('sl-SI')
        };

        entries.unshift(entry);
        saveToStorage();
        renderTimeline();
        updateProgress();
        closeModal();
        resetForm();

        // Success feedback
        showToast('✨ Moment shranjen!');
    }

    function renderTimeline() {
        const timeline = document.getElementById('timeline');
        const filtered = currentCategory === 'all' 
            ? entries 
            : entries.filter(e => e.category === currentCategory);

        if (filtered.length === 0) {
            timeline.innerHTML = `
                <div class="empty-state fade-in">
                    <div class="empty-icon">✨</div>
                    <div class="empty-text">
                        ${currentCategory === 'all' 
                            ? 'Tvoja pot se začne tukaj...<br>Dodaj prvi moment!' 
                            : 'Ni momentov v tej kategoriji'}
                    </div>
                </div>
            `;
            return;
        }

        // Group by date
        const grouped = {};
        filtered.forEach(entry => {
            if (!grouped[entry.date]) grouped[entry.date] = [];
            grouped[entry.date].push(entry);
        });

        let html = '';
        Object.keys(grouped).forEach(date => {
            html += `<div class="timeline-date">${date}</div>`;
            grouped[date].forEach(entry => {
                html += `
                    <div class="entry-card fade-in">
                        ${entry.photo ? `<img src="${entry.photo}" class="entry-image" alt="${entry.title}">` : ''}
                        <div class="entry-content">
                            <div>
                                <span class="tag">${getCategoryName(entry.category)}</span>
                            </div>
                            <div class="entry-title">${entry.title}</div>
                            ${entry.desc ? `<div class="entry-text">${entry.desc}</div>` : ''}
                            <div class="entry-footer">
                                <div class="entry-time">${formatTime(entry.timestamp)}</div>
                                ${entry.link ? `<a href="${entry.link}" target="_blank" class="entry-link">
                                    Poglej več →
                                </a>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
        });

        timeline.innerHTML = html;
    }

    function updateProgress() {
        const count = entries.length;
        const percentage = Math.min((count / 100) * 100, 100);
        
        document.getElementById('entry-count').textContent = count;
        document.getElementById('progress-fill').style.width = percentage + '%';
        document.getElementById('progress-text').textContent = `${count} / 100`;
    }

    function setupCategories() {
        document.querySelectorAll('.category-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                currentCategory = pill.dataset.category;
                renderTimeline();
            });
        });
    }

    function getCategoryName(cat) {
        const names = {
            consciousness: 'Zavest',
            technology: 'Tech',
            philosophy: 'Filozofija',
            love: 'Ljubezen',
            creation: 'Kreacija'
        };
        return names[cat] || cat;
    }

    function formatTime(iso) {
        const date = new Date(iso);
        const now = new Date();
        const diff = Math.floor((now - date) / 1000);

        if (diff < 60) return 'Pravkar';
        if (diff < 3600) return `Pred ${Math.floor(diff / 60)}m`;
        if (diff < 86400) return `Pred ${Math.floor(diff / 3600)}h`;
        if (diff < 604800) return `Pred ${Math.floor(diff / 86400)}d`;
        
        return date.toLocaleDateString('sl-SI', { day: 'numeric', month: 'short' });
    }

    function openAddModal() {
        document.getElementById('add-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('add-modal').style.display = 'none';
    }

    function resetForm() {
        document.getElementById('entry-form').reset();
        document.getElementById('photo-preview').style.display = 'none';
        document.getElementById('upload-text').style.display = 'block';
        currentPhoto = null;
    }

    function saveToStorage() {
        localStorage.setItem('serpentTimeline', JSON.stringify(entries));
    }

    function loadEntries() {
        const saved = localStorage.getItem('serpentTimeline');
        if (saved) entries = JSON.parse(saved);
    }

    function exportData() {
        if (entries.length === 0) {
            alert('Ni podatkov za izvoz!');
            return;
        }

        const data = JSON.stringify({
            exportDate: new Date().toISOString(),
            totalEntries: entries.length,
            entries: entries
        }, null, 2);

        const blob = new Blob([data], {type: 'application/json'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `serpent-timeline-${new Date().toISOString().split('T')[0]}.json`;
        link.click();

        showToast('💾 Izvoženo!');
    }

    function showStats() {
        const total = entries.length;
        const byCategory = {};
        entries.forEach(e => {
            byCategory[e.category] = (byCategory[e.category] || 0) + 1;
        });

        let stats = 'Statistika:\n\n';
        stats += `Skupaj momentov: ${total}\n\n`;
        Object.keys(byCategory).forEach(cat => {
            stats += `${getCategoryName(cat)}: ${byCategory[cat]}\n`;
        });

        alert(stats);
    }

    function showSearch() {
        const query = prompt('Iskanje:');
        if (!query) return;

        const results = entries.filter(e => 
            e.title.toLowerCase().includes(query.toLowerCase()) ||
            (e.desc && e.desc.toLowerCase().includes(query.toLowerCase()))
        );

        if (results.length === 0) {
            alert('Ni rezultatov!');
            return;
        }

        alert(`Najdeno: ${results.length} moment${results.length > 1 ? 'ov' : ''}`);
    }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.textContent = msg;
        toast.style.cssText = `
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 600;
            z-index: 300;
            animation: fadeIn 0.3s;
        `;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }

    // Close modal on background click
    document.getElementById('add-modal').addEventListener('click', (e) => {
        if (e.target.id === 'add-modal') closeModal();
    });
</script>
