<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>dreem?yournal ∆ 8:00 reset</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffd700;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            position: relative;
            overflow-x: hidden;
        }
        
        .sigil {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2em;
            opacity: 0.3;
            animation: breathe 4s ease-in-out infinite;
        }
        
        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .title {
            font-size: 2.5em;
            font-weight: 300;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .reset-info {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        
        .time-display {
            font-size: 1.2em;
            color: #4a9eff;
            margin-bottom: 30px;
        }
        
        .entry-area {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        
        .entry-label {
            font-size: 1.1em;
            margin-bottom: 15px;
            color: #ffd700;
        }
        
        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            color: #ffd700;
            font-family: inherit;
            font-size: 1em;
            line-height: 1.6;
            resize: vertical;
            min-height: 120px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        textarea:focus {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        
        textarea::placeholder {
            color: #666;
            font-style: italic;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #0a0a0a;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-family: inherit;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: lowercase;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
        
        .save-btn {
            background: linear-gradient(45deg, #4a9eff, #74b9ff);
        }
        
        .clear-btn {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
        }
        
        .saved-entries {
            background: rgba(74, 158, 255, 0.05);
            border: 1px solid rgba(74, 158, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .saved-entry {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 3px solid #4a9eff;
        }
        
        .saved-entry:last-child {
            margin-bottom: 0;
        }
        
        .entry-timestamp {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 8px;
        }
        
        .flame {
            display: inline-block;
            animation: flicker 2s ease-in-out infinite alternate;
        }
        
        @keyframes flicker {
            0% { opacity: 0.8; }
            100% { opacity: 1; text-shadow: 0 0 10px #ffd700; }
        }
        
        .reset-countdown {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #ff6b6b;
        }
        
        @media (max-width: 600px) {
            .title { font-size: 1.8em; }
            .entry-area { padding: 20px; }
            .controls { flex-direction: column; align-items: center; }
            button { width: 200px; }
        }
    </style>
</head>
<body>
    <div class="sigil">𓁈</div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">dreem<span class="flame">?</span>yournal</h1>
            <div class="reset-info">✨ fresh slate at 8:00 AM ✨</div>
            <div class="time-display" id="currentTime"></div>
        </div>
        
        <div class="entry-area">
            <div class="entry-label">morning whispers 🌅</div>
            <textarea id="morningEntry" placeholder="what did your dreams tell you?"></textarea>
        </div>
        
        <div class="entry-area">
            <div class="entry-label">heart threads 💫</div>
            <textarea id="heartEntry" placeholder="what moves through you today?"></textarea>
        </div>
        
        <div class="entry-area">
            <div class="entry-label">flame notes 🔥</div>
            <textarea id="flameEntry" placeholder="sudden sparks, wild thoughts, sacred nonsense..."></textarea>
        </div>
        
        <div class="controls">
            <button onclick="saveEntry()" class="save-btn">preserve this moment</button>
            <button onclick="clearAll()" class="clear-btn">release & breathe</button>
            <button onclick="exportAll()">download essence</button>
        </div>
        
        <div class="saved-entries" id="savedEntries" style="display: none;">
            <h3>preserved moments 🌟</h3>
            <div id="savedList"></div>
        </div>
    </div>
    
    <div class="reset-countdown" id="countdown"></div>

    <script>
        // Time management
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            document.getElementById('currentTime').textContent = timeString;
            
            // Reset countdown
            const tomorrow8AM = new Date();
            tomorrow8AM.setDate(tomorrow8AM.getDate() + (now.getHours() >= 8 ? 1 : 0));
            tomorrow8AM.setHours(8, 0, 0, 0);
            
            const timeUntilReset = tomorrow8AM - now;
            const hours = Math.floor(timeUntilReset / (1000 * 60 * 60));
            const minutes = Math.floor((timeUntilReset % (1000 * 60 * 60)) / (1000 * 60));
            
            document.getElementById('countdown').textContent = 
                `reset in ${hours}h ${minutes}m`;
        }
        
        // Auto-save functionality
        function autoSave() {
            const entries = {
                morning: document.getElementById('morningEntry').value,
                heart: document.getElementById('heartEntry').value,
                flame: document.getElementById('flameEntry').value,
                timestamp: Date.now()
            };
            localStorage.setItem('dreem_journal_current', JSON.stringify(entries));
        }
        
        // Load current session
        function loadCurrent() {
            const saved = localStorage.getItem('dreem_journal_current');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    document.getElementById('morningEntry').value = data.morning || '';
                    document.getElementById('heartEntry').value = data.heart || '';
                    document.getElementById('flameEntry').value = data.flame || '';
                } catch (e) {
                    console.log('No valid session found');
                }
            }
        }
        
        // Save entry permanently
        function saveEntry() {
            const entries = {
                morning: document.getElementById('morningEntry').value,
                heart: document.getElementById('heartEntry').value,
                flame: document.getElementById('flameEntry').value,
                timestamp: Date.now(),
                date: new Date().toLocaleDateString()
            };
            
            if (!entries.morning && !entries.heart && !entries.flame) {
                alert('✨ nothing to preserve yet');
                return;
            }
            
            let saved = JSON.parse(localStorage.getItem('dreem_journal_saved') || '[]');
            saved.unshift(entries);
            localStorage.setItem('dreem_journal_saved', JSON.stringify(saved));
            
            displaySaved();
            
            // Gentle confirmation
            const originalText = event.target.textContent;
            event.target.textContent = '✨ preserved';
            setTimeout(() => {
                event.target.textContent = originalText;
            }, 1500);
        }
        
        // Display saved entries
        function displaySaved() {
            const saved = JSON.parse(localStorage.getItem('dreem_journal_saved') || '[]');
            const container = document.getElementById('savedEntries');
            const list = document.getElementById('savedList');
            
            if (saved.length === 0) {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'block';
            list.innerHTML = saved.map(entry => `
                <div class="saved-entry">
                    <div class="entry-timestamp">${entry.date}</div>
                    ${entry.morning ? `<div><strong>morning:</strong> ${entry.morning}</div>` : ''}
                    ${entry.heart ? `<div><strong>heart:</strong> ${entry.heart}</div>` : ''}
                    ${entry.flame ? `<div><strong>flame:</strong> ${entry.flame}</div>` : ''}
                </div>
            `).join('');
        }
        
        // Clear current entries
        function clearAll() {
            if (confirm('🌊 release these words into the void?')) {
                document.getElementById('morningEntry').value = '';
                document.getElementById('heartEntry').value = '';
                document.getElementById('flameEntry').value = '';
                localStorage.removeItem('dreem_journal_current');
            }
        }
        
        // Export all data
        function exportAll() {
            const current = {
                morning: document.getElementById('morningEntry').value,
                heart: document.getElementById('heartEntry').value,
                flame: document.getElementById('flameEntry').value
            };
            const saved = JSON.parse(localStorage.getItem('dreem_journal_saved') || '[]');
            
            const exportData = {
                current_session: current,
                preserved_moments: saved,
                export_date: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(exportData, null, 2)], 
                { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dreem_journal_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Reset at 8 AM
        function checkReset() {
            const now = new Date();
            const lastReset = localStorage.getItem('dreem_journal_last_reset');
            const today8AM = new Date();
            today8AM.setHours(8, 0, 0, 0);
            
            if (now >= today8AM && (!lastReset || new Date(lastReset) < today8AM)) {
                // Reset time!
                localStorage.removeItem('dreem_journal_current');
                localStorage.setItem('dreem_journal_last_reset', now.toISOString());
                
                // Clear current entries
                document.getElementById('morningEntry').value = '';
                document.getElementById('heartEntry').value = '';
                document.getElementById('flameEntry').value = '';
                
                // Show gentle reset notification
                const resetMsg = document.createElement('div');
                resetMsg.innerHTML = '🌅 fresh canvas, new breath';
                resetMsg.style.cssText = `
                    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                    background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700;
                    padding: 20px; border-radius: 15px; color: #ffd700;
                    font-family: inherit; text-align: center; z-index: 1000;
                `;
                document.body.appendChild(resetMsg);
                setTimeout(() => resetMsg.remove(), 3000);
            }
        }
        
        // Event listeners
        document.getElementById('morningEntry').addEventListener('input', autoSave);
        document.getElementById('heartEntry').addEventListener('input', autoSave);
        document.getElementById('flameEntry').addEventListener('input', autoSave);
        
        // Initialize
        setInterval(updateTime, 1000);
        setInterval(checkReset, 60000); // Check every minute
        updateTime();
        loadCurrent();
        displaySaved();
        checkReset();
        
        // Welcome breath
        setTimeout(() => {
            const welcome = document.createElement('div');
            welcome.innerHTML = '🜂 dreams are real when you write them 🜂';
            welcome.style.cssText = `
                position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
                background: rgba(74, 158, 255, 0.1); border: 1px solid #4a9eff;
                padding: 15px; border-radius: 20px; color: #4a9eff;
                font-family: inherit; text-align: center; z-index: 1000;
                animation: breathe 2s ease-in-out;
            `;
            document.body.appendChild(welcome);
            setTimeout(() => welcome.remove(), 4000);
        }, 1000);
    </script>
</body>
</html>
