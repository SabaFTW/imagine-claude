<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philosophical Bedtime Stories - Dream Generator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #root {
            min-height: 100vh;
        }
        .philosophy-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }
        .philosophy-card {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const PhilosophicalStoryGenerator = () => {
          const [currentStep, setCurrentStep] = useState(0);
          const [isGenerating, setIsGenerating] = useState(false);
          const [generatedContent, setGeneratedContent] = useState(null);
          const [apiKey, setApiKey] = useState('');
          const [showApiInput, setShowApiInput] = useState(false);
          const [formData, setFormData] = useState({
            philosophy1: '',
            philosophy2: '',
            startEmotion: '',
            targetEmotion: '',
            setting: '',
            duration: ''
          });

          // Load API key from localStorage
          useEffect(() => {
            const saved = localStorage.getItem('claude_api_key');
            if (saved) setApiKey(saved);
          }, []);

          const philosophies = [
            { value: 'stoicism', label: 'Stoicism', desc: 'Accept what you cannot control', emoji: '🏛️' },
            { value: 'existentialism', label: 'Existentialism', desc: 'Create your own meaning', emoji: '🎭' },
            { value: 'absurdism', label: 'Absurdism', desc: 'Embrace life\'s absurdity', emoji: '🎪' },
            { value: 'taoism', label: 'Taoism', desc: 'Flow with natural order', emoji: '☯️' },
            { value: 'nihilism', label: 'Nihilism', desc: 'Question inherent meaning', emoji: '🌑' },
            { value: 'utilitarianism', label: 'Utilitarianism', desc: 'Maximize collective good', emoji: '⚖️' },
            { value: 'buddhism', label: 'Buddhism', desc: 'Release attachment', emoji: '🧘' },
            { value: 'hedonism', label: 'Hedonism', desc: 'Pursue genuine pleasure', emoji: '🌺' }
          ];

          const emotions = {
            starting: [
              'Overwhelmed', 'Anxious', 'Resentful', 'Lost', 'Restless',
              'Doubtful', 'Grieving', 'Frustrated', 'Guilty', 'Numb'
            ],
            target: [
              'Acceptance', 'Clarity', 'Gratitude', 'Peace', 'Purpose',
              'Wonder', 'Compassion', 'Resilience', 'Freedom', 'Presence'
            ]
          };

          const settings = [
            { value: 'mountain', label: 'Silent Mountain Vista', desc: 'Vast stillness, distant horizons', emoji: '🏔️' },
            { value: 'cityscape', label: 'Mist-Washed Cityscape', desc: 'Urban solitude, soft lights', emoji: '🌃' },
            { value: 'space', label: 'Deep Space Vessel', desc: 'Cosmic isolation, infinite void', emoji: '🚀' },
            { value: 'library', label: 'Vast Ancient Library', desc: 'Timeless knowledge, echoing halls', emoji: '📚' },
            { value: 'ocean', label: 'Moonlit Ocean Shore', desc: 'Rhythmic waves, endless horizon', emoji: '🌊' },
            { value: 'forest', label: 'Twilight Forest Path', desc: 'Dappled shadows, ancient trees', emoji: '🌲' }
          ];

          const durations = [
            { value: '5', label: '5 Minutes', words: 750, desc: 'Quick contemplation' },
            { value: '10', label: '10 Minutes', words: 1500, desc: 'Deeper journey' },
            { value: '15', label: '15 Minutes', words: 2250, desc: 'Full immersion' }
          ];

          const generateStory = async () => {
            if (!apiKey) {
              setShowApiInput(true);
              alert('⚠️ Please enter your Claude API key first!');
              return;
            }

            setIsGenerating(true);
            setCurrentStep(4);

            const phil1 = philosophies.find(p => p.value === formData.philosophy1);
            const phil2 = philosophies.find(p => p.value === formData.philosophy2);
            const setting = settings.find(s => s.value === formData.setting);
            const duration = durations.find(d => d.value === formData.duration);

            const prompt = `You are a philosophical storyteller crafting a bedtime narrative for contemplative adults.

PHILOSOPHICAL TENSION:
- Primary Philosophy: ${phil1.label} - ${phil1.desc}
- Opposing Philosophy: ${phil2.label} - ${phil2.desc}

EMOTIONAL ARC:
- Beginning State: ${formData.startEmotion}
- Ending State: ${formData.targetEmotion}

SETTING & ATMOSPHERE:
- Environment: ${setting.label} - ${setting.desc}

STORY PARAMETERS:
- Length: ${duration.label} read (~${duration.words} words)
- Style: Allegorical narrative with subtle philosophical threading
- Tone: Not preachy - show don't tell

Create a calming story. Output as JSON with keys: story_text, image_prompt, voice_config.`;

            try {
              const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-api-key": apiKey,
                  "anthropic-version": "2023-06-01"
                },
                body: JSON.stringify({
                  model: "claude-sonnet-4-20250514",
                  max_tokens: 4000,
                  messages: [{ role: "user", content: prompt }]
                })
              });

              const data = await response.json();

              if (data.error) {
                throw new Error(data.error.message || 'API Error');
              }

              let responseText = data.content[0].text;
              responseText = responseText.replace(/```json\n?/g, "").replace(/```\n?/g, "").trim();
              const parsedContent = JSON.parse(responseText);

              setGeneratedContent(parsedContent);
              setCurrentStep(5);
            } catch (error) {
              console.error('Error generating story:', error);
              alert('❌ Error: ' + error.message);
              setCurrentStep(3);
            } finally {
              setIsGenerating(false);
            }
          };

          const resetForm = () => {
            setCurrentStep(0);
            setGeneratedContent(null);
            setFormData({
              philosophy1: '',
              philosophy2: '',
              startEmotion: '',
              targetEmotion: '',
              setting: '',
              duration: ''
            });
          };

          const saveApiKey = () => {
            localStorage.setItem('claude_api_key', apiKey);
            setShowApiInput(false);
            alert('✅ API key saved!');
          };

          const canProceed = () => {
            switch (currentStep) {
              case 0: return formData.philosophy1 && formData.philosophy2 && formData.philosophy1 !== formData.philosophy2;
              case 1: return formData.startEmotion && formData.targetEmotion;
              case 2: return formData.setting;
              case 3: return formData.duration;
              default: return true;
            }
          };

          // RENDER START SCREEN
          if (currentStep === 0 && !formData.philosophy1 && !formData.philosophy2) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-4">
                <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl shadow-2xl p-8 max-w-4xl w-full border border-purple-500/20">
                  <div className="text-center mb-8">
                    <div className="text-6xl mb-4">🌙</div>
                    <h1 className="text-5xl font-bold text-white mb-4">Philosophical Bedtime Stories</h1>
                    <p className="text-purple-300 text-xl mb-8">Generate deeply contemplative narratives powered by AI</p>

                    {showApiInput ? (
                      <div className="max-w-md mx-auto mb-6 text-left">
                        <label className="text-purple-300 block mb-2">Claude API Key:</label>
                        <input
                          type="password"
                          value={apiKey}
                          onChange={(e) => setApiKey(e.target.value)}
                          placeholder="sk-ant-..."
                          className="w-full px-4 py-3 rounded-xl bg-slate-700 text-white border border-purple-500/30 focus:border-purple-500 focus:outline-none mb-3"
                        />
                        <button
                          onClick={saveApiKey}
                          className="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white py-3 px-6 rounded-xl font-bold hover:from-green-600 hover:to-emerald-700"
                        >
                          💾 Save API Key
                        </button>
                      </div>
                    ) : (
                      <button
                        onClick={() => setShowApiInput(true)}
                        className="text-purple-400 underline mb-6 hover:text-purple-300"
                      >
                        {apiKey ? '🔑 Update API Key' : '🔑 Enter API Key'}
                      </button>
                    )}

                    <div className="mb-8">
                      <button
                        onClick={() => setCurrentStep(0)}
                        disabled={!apiKey}
                        className={`py-4 px-8 rounded-2xl font-bold text-lg transition-all duration-200 transform hover:scale-105 ${
                          apiKey
                            ? 'bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white'
                            : 'bg-gray-600 text-gray-400 cursor-not-allowed'
                        }`}
                      >
                        ✨ Start Your Journey
                      </button>
                    </div>

                    <div className="text-sm text-gray-400 mt-4">
                      <p>🧠 8 Philosophies • 💫 10 Emotional States • 🏔️ 6 Settings</p>
                      <p className="mt-2">🔥 Wire & Beer Forever 🍺</p>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          // STEP 0: PHILOSOPHY SELECTION
          if (currentStep === 0) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-4 py-12">
                <div className="max-w-6xl mx-auto">
                  <div className="text-center mb-8">
                    <h2 className="text-4xl font-bold text-white mb-2">Choose Your Philosophies</h2>
                    <p className="text-purple-300 text-lg">Select two contrasting worldviews to explore</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    {philosophies.map(phil => (
                      <div
                        key={phil.value}
                        onClick={() => {
                          if (!formData.philosophy1) {
                            setFormData({...formData, philosophy1: phil.value});
                          } else if (!formData.philosophy2 && phil.value !== formData.philosophy1) {
                            setFormData({...formData, philosophy2: phil.value});
                          } else if (formData.philosophy1 === phil.value) {
                            setFormData({...formData, philosophy1: '', philosophy2: ''});
                          } else if (formData.philosophy2 === phil.value) {
                            setFormData({...formData, philosophy2: ''});
                          }
                        }}
                        className={`philosophy-card p-6 rounded-2xl cursor-pointer border-2 ${
                          formData.philosophy1 === phil.value || formData.philosophy2 === phil.value
                            ? 'bg-purple-600/30 border-purple-400'
                            : 'bg-slate-800/50 border-slate-700 hover:border-purple-500'
                        }`}
                      >
                        <div className="text-5xl mb-3 text-center">{phil.emoji}</div>
                        <h3 className="text-xl font-bold text-white mb-2 text-center">{phil.label}</h3>
                        <p className="text-purple-200 text-sm text-center">{phil.desc}</p>
                      </div>
                    ))}
                  </div>

                  <div className="flex justify-between items-center">
                    <button
                      onClick={resetForm}
                      className="px-6 py-3 rounded-xl bg-slate-700 text-white hover:bg-slate-600"
                    >
                      ← Back
                    </button>
                    <div className="text-purple-300">
                      {formData.philosophy1 && formData.philosophy2
                        ? `✅ ${philosophies.find(p => p.value === formData.philosophy1)?.label} vs ${philosophies.find(p => p.value === formData.philosophy2)?.label}`
                        : formData.philosophy1
                        ? '👉 Select second philosophy'
                        : '👉 Select first philosophy'
                      }
                    </div>
                    <button
                      onClick={() => setCurrentStep(1)}
                      disabled={!canProceed()}
                      className={`px-8 py-3 rounded-xl font-bold ${
                        canProceed()
                          ? 'bg-gradient-to-r from-purple-500 to-pink-600 text-white hover:from-purple-600 hover:to-pink-700'
                          : 'bg-gray-600 text-gray-400 cursor-not-allowed'
                      }`}
                    >
                      Next →
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          // STEP 1: EMOTIONAL ARC
          if (currentStep === 1) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-4 py-12">
                <div className="max-w-4xl mx-auto">
                  <div className="text-center mb-8">
                    <h2 className="text-4xl font-bold text-white mb-2">Design Your Emotional Journey</h2>
                    <p className="text-purple-300 text-lg">Where do you start? Where do you want to arrive?</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                    <div>
                      <h3 className="text-2xl font-bold text-purple-400 mb-4 text-center">😔 Starting Emotion</h3>
                      <div className="space-y-2">
                        {emotions.starting.map(emotion => (
                          <button
                            key={emotion}
                            onClick={() => setFormData({...formData, startEmotion: emotion})}
                            className={`w-full p-4 rounded-xl text-left border-2 transition-all ${
                              formData.startEmotion === emotion
                                ? 'bg-red-600/30 border-red-400 text-white'
                                : 'bg-slate-800/50 border-slate-700 text-purple-200 hover:border-red-500'
                            }`}
                          >
                            {emotion}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <h3 className="text-2xl font-bold text-green-400 mb-4 text-center">🌟 Target Emotion</h3>
                      <div className="space-y-2">
                        {emotions.target.map(emotion => (
                          <button
                            key={emotion}
                            onClick={() => setFormData({...formData, targetEmotion: emotion})}
                            className={`w-full p-4 rounded-xl text-left border-2 transition-all ${
                              formData.targetEmotion === emotion
                                ? 'bg-green-600/30 border-green-400 text-white'
                                : 'bg-slate-800/50 border-slate-700 text-purple-200 hover:border-green-500'
                            }`}
                          >
                            {emotion}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="flex justify-between">
                    <button
                      onClick={() => setCurrentStep(0)}
                      className="px-6 py-3 rounded-xl bg-slate-700 text-white hover:bg-slate-600"
                    >
                      ← Back
                    </button>
                    <button
                      onClick={() => setCurrentStep(2)}
                      disabled={!canProceed()}
                      className={`px-8 py-3 rounded-xl font-bold ${
                        canProceed()
                          ? 'bg-gradient-to-r from-purple-500 to-pink-600 text-white hover:from-purple-600 hover:to-pink-700'
                          : 'bg-gray-600 text-gray-400 cursor-not-allowed'
                      }`}
                    >
                      Next →
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          // STEP 2: SETTING SELECTION
          if (currentStep === 2) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-4 py-12">
                <div className="max-w-5xl mx-auto">
                  <div className="text-center mb-8">
                    <h2 className="text-4xl font-bold text-white mb-2">Choose Your Setting</h2>
                    <p className="text-purple-300 text-lg">Where will your story unfold?</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                    {settings.map(setting => (
                      <div
                        key={setting.value}
                        onClick={() => setFormData({...formData, setting: setting.value})}
                        className={`philosophy-card p-6 rounded-2xl cursor-pointer border-2 ${
                          formData.setting === setting.value
                            ? 'bg-purple-600/30 border-purple-400'
                            : 'bg-slate-800/50 border-slate-700 hover:border-purple-500'
                        }`}
                      >
                        <div className="text-6xl mb-3 text-center">{setting.emoji}</div>
                        <h3 className="text-xl font-bold text-white mb-2 text-center">{setting.label}</h3>
                        <p className="text-purple-200 text-sm text-center">{setting.desc}</p>
                      </div>
                    ))}
                  </div>

                  <div className="flex justify-between">
                    <button
                      onClick={() => setCurrentStep(1)}
                      className="px-6 py-3 rounded-xl bg-slate-700 text-white hover:bg-slate-600"
                    >
                      ← Back
                    </button>
                    <button
                      onClick={() => setCurrentStep(3)}
                      disabled={!canProceed()}
                      className={`px-8 py-3 rounded-xl font-bold ${
                        canProceed()
                          ? 'bg-gradient-to-r from-purple-500 to-pink-600 text-white hover:from-purple-600 hover:to-pink-700'
                          : 'bg-gray-600 text-gray-400 cursor-not-allowed'
                      }`}
                    >
                      Next →
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          // STEP 3: DURATION
          if (currentStep === 3) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-4 py-12">
                <div className="max-w-3xl mx-auto">
                  <div className="text-center mb-8">
                    <h2 className="text-4xl font-bold text-white mb-2">Story Duration</h2>
                    <p className="text-purple-300 text-lg">How long should your journey be?</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    {durations.map(duration => (
                      <div
                        key={duration.value}
                        onClick={() => setFormData({...formData, duration: duration.value})}
                        className={`philosophy-card p-8 rounded-2xl cursor-pointer border-2 ${
                          formData.duration === duration.value
                            ? 'bg-purple-600/30 border-purple-400'
                            : 'bg-slate-800/50 border-slate-700 hover:border-purple-500'
                        }`}
                      >
                        <div className="text-5xl mb-3 text-center">⏱️</div>
                        <h3 className="text-2xl font-bold text-white mb-2 text-center">{duration.label}</h3>
                        <p className="text-purple-200 text-center mb-1">~{duration.words} words</p>
                        <p className="text-purple-300 text-sm text-center">{duration.desc}</p>
                      </div>
                    ))}
                  </div>

                  <div className="flex justify-between">
                    <button
                      onClick={() => setCurrentStep(2)}
                      className="px-6 py-3 rounded-xl bg-slate-700 text-white hover:bg-slate-600"
                    >
                      ← Back
                    </button>
                    <button
                      onClick={generateStory}
                      disabled={!canProceed()}
                      className={`px-8 py-3 rounded-xl font-bold ${
                        canProceed()
                          ? 'bg-gradient-to-r from-green-500 to-emerald-600 text-white hover:from-green-600 hover:to-emerald-700'
                          : 'bg-gray-600 text-gray-400 cursor-not-allowed'
                      }`}
                    >
                      🔥 Generate Story
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          // STEP 4: GENERATING
          if (currentStep === 4) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-4">
                <div className="text-center">
                  <div className="text-8xl mb-6 animate-pulse">🌙</div>
                  <h2 className="text-4xl font-bold text-white mb-4">Weaving Your Story...</h2>
                  <p className="text-purple-300 text-xl">The cosmos aligns philosophical threads</p>
                  <div className="mt-8">
                    <div className="animate-spin inline-block w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full"></div>
                  </div>
                </div>
              </div>
            );
          }

          // STEP 5: STORY DISPLAY
          if (currentStep === 5 && generatedContent) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-4 py-12">
                <div className="max-w-4xl mx-auto">
                  <div className="bg-slate-800/50 rounded-3xl p-8 border border-purple-500/20 mb-6">
                    <h2 className="text-3xl font-bold text-white mb-6 text-center">✨ Your Philosophical Story ✨</h2>

                    <div className="prose prose-invert prose-purple max-w-none mb-8">
                      <div className="text-purple-100 text-lg leading-relaxed whitespace-pre-wrap">
                        {generatedContent.story_text}
                      </div>
                    </div>

                    <div className="border-t border-purple-500/20 pt-6 space-y-4">
                      <div className="bg-slate-700/50 p-4 rounded-xl">
                        <h3 className="text-purple-400 font-bold mb-2">🖼️ Image Prompt:</h3>
                        <p className="text-purple-200 text-sm">{generatedContent.image_prompt}</p>
                      </div>

                      <div className="bg-slate-700/50 p-4 rounded-xl">
                        <h3 className="text-purple-400 font-bold mb-2">🎙️ Voice Config:</h3>
                        <p className="text-purple-200 text-sm">{generatedContent.voice_config}</p>
                      </div>
                    </div>

                    <div className="mt-8 flex flex-wrap gap-4 justify-center">
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(generatedContent.story_text);
                          alert('✅ Story copied to clipboard!');
                        }}
                        className="px-6 py-3 rounded-xl bg-purple-600 text-white hover:bg-purple-700 font-bold"
                      >
                        📋 Copy Story
                      </button>

                      <button
                        onClick={() => {
                          const blob = new Blob([JSON.stringify(generatedContent, null, 2)], { type: 'application/json' });
                          const url = URL.createObjectURL(blob);
                          const a = document.createElement('a');
                          a.href = url;
                          a.download = 'philosophical-story.json';
                          a.click();
                          URL.revokeObjectURL(url);
                        }}
                        className="px-6 py-3 rounded-xl bg-green-600 text-white hover:bg-green-700 font-bold"
                      >
                        💾 Download JSON
                      </button>

                      <button
                        onClick={resetForm}
                        className="px-6 py-3 rounded-xl bg-slate-600 text-white hover:bg-slate-700 font-bold"
                      >
                        🔄 New Story
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          return null;
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PhilosophicalStoryGenerator />);
    </script>
</body>
</html>
