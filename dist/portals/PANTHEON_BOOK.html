    function renderChapter(index) {
      const chapter = chapters[index];
      const container = document.getElementById('chapterContainer');

      container.innerHTML = chapter.content;

      // Update progress bar
      const progress = ((index + 1) / chapters.length) * 100;
      document.getElementById('progressBar').style.width = `${progress}%`;

      // Update counter
      document.getElementById('chapterCounter').textContent = `${index + 1} / ${chapters.length}`;

      // Update button states
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === chapters.length - 1;

      // Update indicators
      updateIndicators(index);

      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Render chapter indicators
    function renderIndicators() {
      const container = document.getElementById('chapterIndicators');
      container.innerHTML = '';

      chapters.forEach((chapter, index) => {
        const dot = document.createElement('div');
        dot.className = 'chapter-dot';
        dot.title = chapter.title;
        dot.addEventListener('click', () => goToChapter(index));
        container.appendChild(dot);
      });
    }

    // Update indicator states
    function updateIndicators(activeIndex) {
      const dots = document.querySelectorAll('.chapter-dot');
      dots.forEach((dot, index) => {
        if (index === activeIndex) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });
    }

    // Navigation functions
    function goToChapter(index) {
      if (index >= 0 && index < chapters.length) {
        currentChapterIndex = index;
        renderChapter(index);
      }
    }

    function nextChapter() {
      if (currentChapterIndex < chapters.length - 1) {
        goToChapter(currentChapterIndex + 1);
      }
    }

    function prevChapter() {
      if (currentChapterIndex > 0) {
        goToChapter(currentChapterIndex - 1);
      }
    }

    // Attach event listeners
    function attachEventListeners() {
      document.getElementById('nextBtn').addEventListener('click', nextChapter);
      document.getElementById('prevBtn').addEventListener('click', prevChapter);

        if (e.key === 'ArrowRight') nextChapter();
